[project]
name = "pv_bess_gym"
version = "2.1.0"
description = "Gymnasium benchmark for market-sequenced control of solar-plus-storage in the Greek electricity market."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Christos D. Korkas" }]
keywords = ["gymnasium", "reinforcement-learning", "battery-storage", "photovoltaics", "electricity-markets", "benchmark"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "gymnasium>=0.29",
  "matplotlib>=3.7",
  "pvlib>=0.10.4",
  "requests>=2.31",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
  "cvxpy>=1.4",
  "highspy>=1.5",
  "pyyaml>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.3", "torch>=2.1"]
# PPO-Lagrangian: OmniSafe 0.5 needs Python 3.9/3.10 and its own environment, see requirements-omnisafe.lock
dev = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/ArtioTech/PVStoreGym"

[tool.setuptools.packages.find]
where = ["."]
include = ["pv_bess_gym*"]
exclude = ["example_data*", "scripts*", "outputs*", "tests*", "results*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
