name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[rl,dev]"
      - name: Tests
        run: pytest -q
      - name: Gymnasium API check on the bundled sample
        run: |
          python - <<'PY'
          from gymnasium.utils.env_checker import check_env
          from pv_bess_gym import make_unified_env
          env = make_unified_env(signals_path="example_data", plant_config_path="example_data/station_athens.json")
          check_env(env, skip_render_check=True)
          PY
      - name: Legacy sample must be reported as proxy data
        run: |
          if python scripts/data/verify_dataset.py example_data; then
            echo "expected the legacy sample to fail the provenance check"; exit 1
          fi
